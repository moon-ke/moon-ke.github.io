<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广东奶龙大学</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFF8F5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: 36px;
    color: #8B0000;
    margin-bottom: 40px;
    letter-spacing: 4px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 400px;
  }

  .links a {
    display: block;
    padding: 16px 24px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    text-decoration: none;
    color: #333;
    font-size: 16px;
    text-align: center;
    transition: all 0.2s;
  }

  .links a:hover {
    background: #8B0000;
    color: #fff;
    border-color: #8B0000;
  }
</style>
</head>
<body>

<h1>广东奶龙大学</h1>

<div class="links">
  <a href="https://www.gdut.edu.cn" target="_blank">广东工业大学官网</a>
  <a href="https://jwc.gdut.edu.cn" target="_blank">教务处</a>
  <a href="https://xjw.gdut.edu.cn" target="_blank">学生处</a>
  <a href="https://lib.gdut.edu.cn" target="_blank">图书馆</a>
  <a href="https://portal.gdut.edu.cn" target="_blank">网上办事大厅</a>
</div>

</body>
</html>
